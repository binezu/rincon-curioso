name: Descargar nuevo mes
# solo agrega los meses que todavia no estan: correrlo de mas no duplica nada
on:
  schedule:
    - cron: '0 12 5 * *'        # dia 5 de cada mes
  workflow_dispatch:
    inputs:
      meses:
        description: 'Meses AAAA-MM separados por espacio (vacio = los que falten)'
        required: false
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-modelos-v1
      - run: pip install -r robot/requirements.txt
      - run: python robot/nuevo_mes.py ${{ github.event.inputs.meses }}
      - name: Guardar y reentrenar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "robot"
          git config user.email "robot@users.noreply.github.com"
          git add docs/data huellas
          git diff --cached --quiet && exit 0
          git commit -m "Meses nuevos"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 5; done
          gh workflow run publicar.yml
